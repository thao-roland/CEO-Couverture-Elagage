<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a535a"/>
      <stop offset="0.12" stop-color="#3d464c"/>
      <stop offset="1" stop-color="#2f363b"/>
    </linearGradient>
    <filter id="sln"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="9"/><feColorMatrix type="saturate" values="0"/></filter>
    <pattern id="slt" width="120" height="76" patternUnits="userSpaceOnUse">
      <rect width="120" height="76" fill="#23282b"/>
      <g fill="url(#sl)">
        <rect x="1" y="1" width="57" height="36"/>
        <rect x="61" y="1" width="57" height="36"/>
        <rect x="-29" y="39" width="57" height="36"/>
        <rect x="31" y="39" width="57" height="36"/>
        <rect x="91" y="39" width="57" height="36"/>
      </g>
      <g fill="#525b62" opacity="0.5">
        <rect x="1" y="1" width="57" height="2"/>
        <rect x="61" y="1" width="57" height="2"/>
        <rect x="31" y="39" width="57" height="2"/>
        <rect x="91" y="39" width="57" height="2"/>
        <rect x="-29" y="39" width="57" height="2"/>
      </g>
    </pattern>
  </defs>
  <rect width="360" height="360" fill="url(#slt)"/>
  <rect width="360" height="360" filter="url(#sln)" opacity="0.16" style="mix-blend-mode:overlay"/>
</svg>
